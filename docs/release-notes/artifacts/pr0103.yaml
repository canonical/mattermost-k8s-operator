# Version of the artifact schema
version_schema: 2

# The key holding the change(s)
changes:
- title: Added a how-to guide for managing push notifications
  author: minulo
  type: minor
  description: |
    Added a how-to guide that explains how to turn on, configure, and turn off mobile
    push notifications with the `push-notification-server` and
    `push-notifications-include-message-snippet` configuration options. The guide
    links to the upstream Mattermost documentation. Also clarified in the security
    overview that ID-only push notifications require a Mattermost Entry, Enterprise,
    or Enterprise Advanced license.
  urls:
    pr:
      - "https://github.com/canonical/mattermost-k8s-operator/pull/103"
    related_doc:
      - "https://github.com/canonical/mattermost-k8s-operator/docs/how-to/manage-push-notifications.md"
    related_issue:
  visibility: public
  highlight: false
