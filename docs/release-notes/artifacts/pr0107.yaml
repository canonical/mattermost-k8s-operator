# Version of the artifact schema
version_schema: 2

# The key holding the change(s)
changes:
- title: Pinned the Ubuntu 24.04 base in the promote charm workflow
  author: DeeKay3
  type: bugfix
  description: |
    Set the `base-name`, `base-channel` and `base-architecture` inputs of the promote
    charm workflow to `ubuntu`, `24.04` and `amd64`. Without them, the reusable workflow
    promoted the first base with an open `latest/edge` release, which was the legacy
    Ubuntu 20.04 base (revision 18), instead of the current Ubuntu 24.04 revision.
  urls:
    pr: 
      - "https://github.com/canonical/mattermost-k8s-operator/pull/107"
    related_doc:
    related_issue:
  visibility: internal
  highlight: false
