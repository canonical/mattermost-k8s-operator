- title: Enabled MetalLB in the integration test MicroK8s cluster
  author: minulo
  type: bugfix
  description: |
    Enabled the MicroK8s `metallb` add-on in the integration test workflow so the
    `traefik-k8s` LoadBalancer service obtains an external address and Traefik reaches
